name: dist-check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: dist-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: dist generate --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Install cargo-dist 0.31.0
        run: cargo install cargo-dist --version=0.31.0 --locked
      - name: Verify generated workflow has no drift
        run: dist generate --check

  cross-pin-lint:
    name: cross-pin lint (scoop-bump.yml ↔ dist-workspace.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Verify actions/checkout SHA pin is consistent
        run: |
          TOML_SHA=$(grep -E '^\s*"actions/checkout"\s*=' dist-workspace.toml | grep -oE '"[0-9a-f]{40}"' | tr -d '"')
          YML_SHA=$(grep -oE 'actions/checkout@[0-9a-f]{40}' .github/workflows/scoop-bump.yml | head -1 | cut -d@ -f2)
          # CF-06 hardening (per SPEC_REVIEW R2 § 3 CF-06): a `grep` that
          # finds no match leaves its capture variable empty, and
          # `test "" = ""` evaluates true — so the lint would silently pass
          # on the most likely real-world drift (TOML entry removed or YAML
          # `uses:` line refactored). Fail loudly on either-side empty
          # BEFORE the equality check.
          test -n "$TOML_SHA" || { echo "FAIL: could not extract actions/checkout SHA from dist-workspace.toml"; exit 1; }
          test -n "$YML_SHA"  || { echo "FAIL: could not extract actions/checkout SHA from .github/workflows/scoop-bump.yml"; exit 1; }
          test "$TOML_SHA" = "$YML_SHA" || { echo "FAIL: actions/checkout SHA pin in scoop-bump.yml ($YML_SHA) does not match dist-workspace.toml ($TOML_SHA); rotate BOTH files in the same commit per scoop-bump.yml's top-of-file invariant comment"; exit 1; }
          echo "OK actions/checkout SHA pin consistent: $YML_SHA"
