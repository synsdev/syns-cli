name: Security report

# Every advisory the dependency audit reports, those no patched release exists
# for included. The blocking gate of ci.yml fails only on what a patched
# release clears; this report is where the rest are seen. It fails nothing:
# read it in the run's summary or its artifact.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      - run: cargo install --locked cargo-audit
      - run: cargo audit > audit.txt 2>&1 || true
      - name: Summary
        run: |
          {
            echo "### Dependency audit"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-audit
          path: audit.txt
