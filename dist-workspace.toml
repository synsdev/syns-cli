[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = ["shell", "powershell", "homebrew"]
publish-jobs = ["homebrew"]
tap = "synsdev/homebrew-syns"
formula = "syns"
# github-attestations disabled: synsdev/syns-cli is private and the synsdev
# org has no GitHub Enterprise plan, so actions/attest-build-provenance fails
# with "Feature not available for the synsdev organization". Empirically
# observed on v0.2.0 (run 25694946181). u199 prototype NR-01: re-enable only
# after either making syns-cli public or upgrading the org plan.
github-attestations = false
unix-archive = ".tar.gz"
windows-archive = ".zip"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"

[dist.github-custom-runners]
x86_64-apple-darwin = "macos-15-intel"

[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
"actions/upload-artifact" = "b7c566a772e6b6bfb58ed0dc250532a479d7789f"  # v6.0.0
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131"  # v7.0.0
"actions/attest-build-provenance" = "96278af6caaf10aea03fd8d33a09a777ca52d62f"  # v3.2.0
