[package]
name = "syns-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "syns"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
comfy-table = "7"
console = "0.15"
dirs = "6"

[dev-dependencies]
serial_test = "3"
