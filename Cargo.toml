[package]
name = "syns-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "syns"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
sha1 = "0.10"
sha2 = "0.10"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
comfy-table = "7"
console = "0.16"
dirs = "6"
open = "5"
url = "2"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
