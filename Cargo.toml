[package]
name = "syns"
version = "0.2.6"
edition = "2024"
description = "Command-line client for the Syns coordinated multi-agent development platform."
license = "MIT"
homepage = "https://github.com/synsdev/syns-cli"
repository = "https://github.com/synsdev/syns-cli"
readme = "README.md"
keywords = ["syns", "cli", "git", "multi-agent", "version-control"]

[lib]
name = "syns_cli"
path = "src/lib.rs"

[[bin]]
name = "syns"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.11"
ignore = "0.4"
tokio = { version = "1", features = ["full"] }
comfy-table = "7"
console = "0.16"
dirs = "6"
url = "2"
urlencoding = "2"
open = "5"
tempfile = "3"
semver = "1"
flate2 = "1"
tar = "0.4"
zip = "8"
sha2 = "0.10"
self-replace = "1.5"
thiserror = "2"

[dev-dependencies]
serial_test = "3"
wiremock = "0.6"
assert_cmd = "2"

[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
