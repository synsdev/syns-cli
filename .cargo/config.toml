# Windows reserves 1 MiB of stack for a process's main thread — the MSVC
# and GNU linker defaults — where Linux and macOS reserve 8 MiB. `main`
# builds clap's whole command tree on that thread before it reads an
# argument, and an unoptimised build of this crate's tree stands within
# 2% of 1 MiB, so a subcommand added to `src/main.rs` overflows the
# Windows debug binary on `syns --help` (CI run 35555203821, job
# `convergence-windows`). Reserve what every other platform reserves, so
# the Windows linker default is not what decides how many subcommands
# `syns` may carry.

[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "link-arg=/STACK:8388608"]

[target.'cfg(all(windows, target_env = "gnu"))']
rustflags = ["-C", "link-arg=-Wl,--stack,8388608"]
